services:
  paradiserp:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: paradiserp:latest
    container_name: paradiserp-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:5085:5080"
    volumes:
      - /opt/paradierp/data:/data
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      Database__Provider: "Sqlite"
      Database__AllowSqliteInProduction: "true"
      ConnectionStrings__Default: "Data Source=/data/default.db"
      Platform__Enabled: "true"
      Platform__Host: "erp.paradistack.com"
      Logging__LogLevel__Microsoft.AspNetCore: "Debug"
      Platform__ConnectionString: "Data Source=/data/platform.db"
      Platform__CompanyDataDirectory: "/data/companies"
      Jwt__Key: "4aad2ef1ade352779ed7472f4c47fa08a72a86777fbc933f8ffd8d5ded2bad98"
      DataProtection__KeysPath: "/data/keys"
      Files__Root: "/data/files"
      Bootstrap__AdminUsername: "admin"
      Bootstrap__AdminPassword: "ParadisERPAdmin2026!"
      Country: "DZ"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Host: erp.paradistack.com' http://127.0.0.1:5080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
